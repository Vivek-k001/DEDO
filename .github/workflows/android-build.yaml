name: "Build and Release APK"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APKs (Split per ABI & Universal)
        run: |
          # 1. Build architecture-specific APKs (~28MB for arm64)
          flutter build apk --release --split-per-abi
          # 2. Rename split APKs for clarity
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/dedo-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/dedo-armeabi-v7a.apk
          # 3. Build universal all-in-one fallback APK (~58MB)
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/dedo-universal.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dedo-apks
          path: |
            build/app/outputs/flutter-apk/dedo-arm64-v8a.apk
            build/app/outputs/flutter-apk/dedo-universal.apk
          overwrite: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/dedo-arm64-v8a.apk
            build/app/outputs/flutter-apk/dedo-universal.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
