name: todo
description: "DEDO - A premium Liquid Glass TODO app"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # Fonts
  google_fonts: ^6.2.1

  # Shimmer
  shimmer: ^3.0.0

  # Date/time
  intl: ^0.19.0

  # UUID
  uuid: ^4.4.0

  # Permissions
  permission_handler: ^11.3.1
  flutter_svg: ^2.3.0

  # App Updates & In-App Installation
  package_info_plus: ^8.1.2
  http: ^1.2.2
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
